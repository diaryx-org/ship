[package]
name = "ship"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Cut a repository's release and run its CI, from one config file: propose a version, bump it, regenerate the changelog, tag, push, and write the GitHub release."
repository = "https://github.com/diaryx-org/ship"
# Consumed from git, like the org's other tools; `ship` is taken on crates.io.
publish = false

[dependencies]
# fig reads the config, in figl by default and in TOML from before figl: one
# `from_str` per format, with serde, and cargo's and gh's JSON the same way.
fig = { version = "7", features = ["serde"] }
fig-figl = "7"
fig-toml = "7"
fig-json = "7"
serde = { version = "1", features = ["derive"] }
# How wide to wrap a proposal's trailers.
terminal_size = "0.4"
